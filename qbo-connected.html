<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyGoodBooks — QuickBooks</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 420px;
        margin: 80px auto;
        padding: 0 24px;
        text-align: center;
        color: #1a1a1a;
        background: #fff;
      }
      h1 { font-size: 20px; }
      p { color: #555; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1 id="title">Working…</h1>
    <p id="sub"></p>
    <script>
      // The Edge Function redirects here with only a plain status word in the
      // query string — never the OAuth code or any token, since this page's
      // own URL can end up in browser history / Referer headers. On an
      // exchange failure it may add ref=<intuit_tid> (Intuit's id for the
      // call, for support). The ref is re-checked here with the same pattern
      // qbo-callback uses (letters, digits, dashes, 8-64 long) and shown only
      // as text, so a crafted link can't inject anything.
      var qs = new URLSearchParams(location.search);
      var status = qs.get("status");
      var rawRef = qs.get("ref");
      var ref = typeof rawRef === "string" && /^[0-9A-Za-z-]{8,64}$/.test(rawRef) ? rawRef : null;
      var copy = {
        connected: ["QuickBooks connected", "You can close this tab and go back to MyGoodBooks."],
        cancelled: ["Connection cancelled", "You can close this tab and go back to MyGoodBooks."],
        invalid: ["Link expired", "This QuickBooks connection link is invalid or expired. Ask MyGoodBooks to try again."],
        error: [
          "Couldn't connect",
          "We couldn't finish connecting QuickBooks. Ask an admin to retry." + (ref ? " Error id: " + ref : ""),
        ],
        not_configured: ["Couldn't connect", "QuickBooks isn't set up for this account type yet. Ask an admin."],
      }[status] || ["Couldn't connect", "Something went wrong. Ask MyGoodBooks to try again."];
      document.getElementById("title").textContent = copy[0];
      document.getElementById("sub").textContent = copy[1];
    </script>
  </body>
</html>
