<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no. Blocking pinch-zoom is a WCAG 2.1
         SC 1.4.4 failure, and this app's audience — church office managers and
         nonprofit treasurers reading transaction tables on a phone — is exactly
         who needs to magnify. See the touchmove note below for why the gesture
         blocker that used to back this up is gone too. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyGoodBooks — Client Dashboard (Prototype)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One request for the whole app. Bitter / IBM Plex Sans / IBM Plex Mono are
         shared with <DailyClose />; the shell additionally needs Bitter italic and
         weight 800. No next/font here (no Next.js, no bundler), so they load the
         <link> way, per the component's integration notes. Lato is gone. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // §149/§161: no explicit theme choice follows the OS light/dark
      // setting (app.jsx's autoTheme), not always-dark. This mirrors
      // app.jsx's systemOrClockTheme() exactly — matchMedia is readable
      // synchronously, so unlike the geolocation lookup this replaced,
      // the very first frame can now agree with what React will render
      // instead of being refined afterward. The clock heuristic remains
      // the fallback for a browser reporting no preference.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("mygoodbooks_theme_v1");
        } catch (e) {}
        var theme;
        if (stored === "light" || stored === "dark") {
          theme = stored;
        } else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          theme = "dark";
        } else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches
        ) {
          theme = "light";
        } else {
          var hour = new Date().getHours();
          theme = hour >= 6 && hour < 19 ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();

      // Bumped by hand alongside each deploy-worthy change — there's no build
      // step to inject a real commit SHA into (see the no-bundler note up
      // top). Shown in Staff Access's System Info card so staff can confirm
      // which version they're looking at without guessing from Vercel's UI.
      window.MGB_VERSION = { label: "2026-09-22a", note: "Manage access glow is per-client; access requests surfaced on Bookkeeper Home" };
      // The two-finger touchmove preventDefault that used to sit here (a
      // pinch-zoom blocker, kept at the gesture level because touch-action
      // CSS pre-empted the dashboard drag-and-drop) is gone. It only ever
      // protected mouse-driven card reordering — styles.css states outright
      // that dragging is mouse-only and that mobile reorders through the
      // up/down buttons instead — so it was defending a gesture that does
      // not exist on touch, at the cost of an accessibility failure.

      // Cache-bust so local edits to styles.css always show up on reload.
      document.write('<link rel="stylesheet" href="styles.css?v=' + Date.now() + '">');
      document.write(
        '<link rel="stylesheet" href="components/daily-close/DailyClose.css?v=' + Date.now() + '">'
      );

      // Kick every source fetch off HERE, in <head>, so all five download in
      // parallel with React/Babel/jsPDF instead of after them. Previously each
      // file was fetched only once the previous one had finished compiling, so
      // app.jsx — the big one — wasn't even requested until ~17s in. Babel still
      // has to compile them in dependency order, but the network is no longer
      // the bottleneck. window.__sources holds text promises, not text.
      window.__SOURCE_ORDER = [
        "auth-config.js",
        "qbo-config.js",
        "components/auth/supabaseClient.js",
        "components/auth/AuthGate.jsx",
        "components/auth/ClientAuthGate.jsx",
        "data.js",
        "components/daily-close/sampleData.ts",
        "components/daily-close/DailyClose.tsx",
        "components/daily-close/fromClient.js",
        "components/qbo/mapQboToClient.js",
        "app.jsx",
      ];
      window.__sources = {};
      window.__SOURCE_ORDER.forEach(function (path) {
        window.__sources[path] = fetch(path + "?v=" + Date.now(), { cache: "no-store" })
          .then(function (r) {
            if (!r.ok) throw new Error(r.status + " " + r.statusText);
            return r.text();
          });
      });
    </script>
  </head>
  <body>
    <!-- Replaced by React on first render. Without this the page is a blank
         black rectangle for the whole boot, which reads as "the site is broken". -->
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite">
        <div class="boot-splash-mark">MyGoodBooks</div>
        <div class="boot-splash-sub">Loading your portal…</div>
        <div class="boot-splash-bar"><span></span></div>
      </div>
    </div>

    <!-- Every third-party script is pinned to an EXACT version and carries a
         Subresource Integrity hash. Previously react@18, react-dom@18,
         @babel/standalone (no version at all) and @supabase/supabase-js@2 were
         floating ranges served without integrity, so the bytes executing in an
         origin that holds a live Supabase session could change without a commit
         here — and a compromised or spoofed CDN response would have had a free
         hand on the session token. supabase.js is the sharpest case, since it
         IS the thing holding the session.

         Regenerating a hash after a version bump (the CDN serves the npm
         tarball's file verbatim, so the tarball is the source of truth):
           npm pack react@18.3.1 && tar xzf react-18.3.1.tgz
           openssl dgst -sha384 -binary package/umd/react.production.min.js \
             | openssl base64 -A
         A mismatched hash makes the browser refuse the script outright, so if
         the app ever boots to a blank page right after a version change, these
         attributes are the first thing to check. -->
    <script
      crossorigin="anonymous"
      integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
      src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
    ></script>
    <script
      crossorigin="anonymous"
      integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
    ></script>
    <script
      crossorigin="anonymous"
      integrity="sha384-AISI5AuDG6E8DeEiFMVB3rGQxhZt24OU0avMp+GMV64+tpnA3+Z6F5MT0f96iPva"
      src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
    ></script>
    <!-- Staff login gate (Phase 1 of the auth plan). Exposes window.supabase,
         read by components/auth/supabaseClient.js. -->
    <script
      crossorigin="anonymous"
      integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
      src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
    ></script>
    <!-- defer: only needed when someone clicks Download PDF, long after boot.
         Undeferred these blocked React and Babel from executing. -->
    <script
      defer
      crossorigin="anonymous"
      integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/"
      src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"
    ></script>
    <script
      defer
      crossorigin="anonymous"
      integrity="sha384-Xl/CUCfJbzsngMp0CFxkmF0VW/8C160IsGujqeQlIhaGxKz2+JsIGORFqtCPeldF"
      src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"
    ></script>

    <script>
      // Manually fetch + transform each file so we can force Babel's
      // "classic" JSX runtime (the default "automatic" runtime needs a
      // real module bundler, which we intentionally don't have here).
      async function loadBabelScript(path) {
        // Text was already requested in <head>; this just awaits that promise.
        const src = await window.__sources[path];
        // DailyClose ships as TypeScript. The preset only strips the types
        // (no type-checking) and infers JSX from the filename we pass below,
        // so a plain .ts file never gets the JSX plugin it would reject.
        const presets = [];
        if (/\.tsx?$/.test(path)) presets.push("typescript");
        if (/\.(jsx|tsx)$/.test(path)) presets.push(["react", { runtime: "classic" }]);
        if (/\.js$/.test(path)) presets.push(["react", { runtime: "classic" }]);
        const code = Babel.transform(src, { filename: path, presets }).code;
        const script = document.createElement("script");
        script.text = code;
        document.body.appendChild(script);
      }

      // §133: fetches the real client-org roster from Supabase's `clients`
      // table and merges it onto data.js's window.CLIENTS (already assigned
      // an empty array by data.js, then re-populated here). Every
      // CLIENTS_MOCK_DATA entry (mock financial/content data, still in
      // data.js) is matched onto its roster row by `id`; a roster row with
      // no matching mock entry still merges in on its own (a newly
      // admin-added client has no mock data yet, and that's fine — nothing
      // should crash or skip it). Must run after data.js (which declares
      // window.CLIENTS) and before app.jsx (which reads it as a plain
      // synchronous array via the bare `CLIENTS` identifier throughout, with
      // no await anywhere in app.jsx). If Supabase isn't configured, or the
      // fetch fails, window.CLIENTS is left as the empty array rather than
      // letting a network hiccup block the whole app from booting.
      async function loadClientsRoster() {
        const supabase = window.mgbSupabase;
        if (!supabase) return;
        try {
          const { data, error } = await supabase
            .from("clients")
            .select(
              "id, name, org_type, plan, test_only, payroll_add_on, assigned_bookkeeper",
            );
          if (error) {
            console.warn("Couldn't load client roster from Supabase:", error.message);
            return;
          }
          const mockById = {};
          (window.CLIENTS_MOCK_DATA_SOURCE || []).forEach((c) => {
            mockById[c.id] = c;
          });
          window.CLIENTS = (data || []).map((row) => {
            const roster = {
              id: row.id,
              name: row.name,
              orgType: row.org_type,
              plan: row.plan,
              testOnly: row.test_only,
              payrollAddOn: row.payroll_add_on,
              assignedBookkeeper: row.assigned_bookkeeper,
            };
            // withClientDataDefaults (data.js) backfills the empty arrays a
            // roster-only org has none of, so app.jsx's unguarded
            // client.monthly[...] / client.bankAccounts[0] indexing renders an
            // empty state instead of throwing into the root ErrorBoundary.
            return window.withClientDataDefaults(
              Object.assign({}, mockById[row.id], roster),
            );
          });
        } catch (err) {
          console.warn("Couldn't load client roster from Supabase:", err);
        }
      }

      // §170: the QuickBooks half of the same boot step. loadClientsRoster
      // above gives each client its identity; this gives the connected ones
      // their actual numbers, replacing data.js's sample arrays via
      // window.mapQboToClient (components/qbo/mapQboToClient.js).
      //
      // Additive and fail-soft, exactly like the roster loader: a client
      // with no qbo_connections row, a disconnected one, a query that errors,
      // or no Supabase at all simply keeps its sample data and its
      // "Sample Data" banners. Nothing here can stop the app booting.
      //
      // Runs AFTER loadClientsRoster (it reads window.CLIENTS) and before
      // app.jsx, which takes window.CLIENTS as a plain synchronous array.
      // RLS does the scoping — the qbo_* policies only return rows for
      // clients this session may see — so the .in() filters below are about
      // not fetching rows we'd throw away, not about access control.
      //
      // Also re-run after boot by the header's "Sync now" button
      // (window.mgbReloadQboData in app.jsx) with `onlyIds` = the one client
      // just synced: same queries, same mapper, narrowed to that client, and
      // every other client passes through untouched. mapQboToClient is
      // idempotent over an already-mapped client (it Object.assigns the same
      // six fields again), so re-mapping is safe.
      async function loadQboData(onlyIds) {
        const supabase = window.mgbSupabase;
        if (!supabase) return;
        if (!window.mapQboToClient) return;
        const clients = window.CLIENTS || [];
        if (!clients.length) return;
        const ids = Array.isArray(onlyIds) && onlyIds.length
          ? clients.map((c) => c.id).filter((id) => onlyIds.indexOf(id) !== -1)
          : clients.map((c) => c.id);
        if (!ids.length) return;
        try {
          const { data: connections, error: connErr } = await supabase
            .from("qbo_connections")
            .select("client_id, status, last_synced_at, last_error")
            .in("client_id", ids);
          if (connErr) {
            console.warn("Couldn't load QuickBooks connections:", connErr.message);
            return;
          }
          const connById = {};
          (connections || []).forEach((row) => {
            connById[row.client_id] = row;
          });
          const liveIds = (connections || [])
            .filter((row) => row.status === "connected")
            .map((row) => row.client_id);
          if (!liveIds.length) return;

          // One round trip per table for every connected client at once,
          // rather than per client per table.
          const tables = {
            accounts: "qbo_accounts",
            monthlyPl: "qbo_monthly_pl",
            budgetLines: "qbo_budget_lines",
            invoices: "qbo_invoices",
            bills: "qbo_bills",
            transactions: "qbo_transactions",
          };
          const keys = Object.keys(tables);
          const results = await Promise.all(
            keys.map((key) =>
              supabase.from(tables[key]).select("*").in("client_id", liveIds),
            ),
          );
          const byKey = {};
          keys.forEach((key, i) => {
            const { data, error } = results[i];
            if (error) {
              console.warn(
                "Couldn't load " + tables[key] + ":",
                error.message,
              );
            }
            byKey[key] = data || [];
          });

          // Bucket every table's rows by client once, so mapping is a lookup
          // rather than a filter per client per table.
          const rowsByClient = {};
          liveIds.forEach((id) => {
            rowsByClient[id] = { connection: connById[id] };
            keys.forEach((key) => {
              rowsByClient[id][key] = [];
            });
          });
          keys.forEach((key) => {
            byKey[key].forEach((row) => {
              const bucket = rowsByClient[row.client_id];
              if (bucket) bucket[key].push(row);
            });
          });

          window.CLIENTS = clients.map((client) => {
            const rows = rowsByClient[client.id];
            // A connected client whose first sync hasn't landed yet has a
            // connection row but no data. Mapping it would blank every page
            // and still claim "Live", which is worse than sample data —
            // so require at least some real numbers first.
            if (!rows) return client;
            const hasData =
              rows.accounts.length ||
              rows.monthlyPl.length ||
              rows.invoices.length ||
              rows.bills.length;
            if (!hasData) return client;
            return window.mapQboToClient(client, rows);
          });
        } catch (err) {
          console.warn("Couldn't load QuickBooks data from Supabase:", err);
        }
      }

      window.mgbReloadQboData = loadQboData;

      (async () => {
        try {
          // Order still matters — data.js and DailyClose must exist before
          // app.jsx runs — but every file is already in flight by now.
          for (const path of window.__SOURCE_ORDER) {
            await loadBabelScript(path);
            if (path === "data.js") await loadClientsRoster();
            // Needs both the roster (window.CLIENTS) and the mapper, and must
            // land before app.jsx reads window.CLIENTS synchronously.
            if (path === "components/qbo/mapQboToClient.js") await loadQboData();
          }
        } catch (err) {
          const root = document.getElementById("root");
          if (root) {
            root.innerHTML =
              '<div class="boot-splash"><div class="boot-splash-mark">MyGoodBooks</div>' +
              '<div class="boot-splash-sub">Something went wrong loading the portal. ' +
              "Please refresh.</div></div>";
          }
          throw err;
        }
      })();
    </script>
  </body>
</html>
