<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no. Blocking pinch-zoom is a WCAG 2.1
         SC 1.4.4 failure, and this app's audience — church office managers and
         nonprofit treasurers reading transaction tables on a phone — is exactly
         who needs to magnify. See the touchmove note below for why the gesture
         blocker that used to back this up is gone too. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyGoodBooks</title>
    <script>
      // Tasks shell (spec 11.1). Runs first, before every other script and
      // before the CSS document.write lines. /tasks (a Vercel redirect to
      // /?shell=tasks) or ?shell=tasks turns on the slim Tasks shell for this
      // tab; ?shell=portal turns it off. The flag lives in sessionStorage so
      // it survives the Google sign-in round trip. An auth hash is never
      // rewritten, and every replaceState keeps history.state (AN_AppNav's
      // mgbNav index).
      // MGB Slate (spec-desk-fullpage 3.1): /slate (a Vercel rewrite, the path
      // stays /slate so it can be its own installed app's scope) turns on the
      // same Tasks shell but keeps the pathname. mgb_slate_path_v1 remembers
      // that this tab started on /slate, so the Google sign-in (which returns
      // to /staff) can come back to /slate. With the Slate app off, /slate is
      // simply the Tasks shell.
      (function () {
        try {
          var p = location.pathname, sp = new URLSearchParams(location.search), q = sp.get("shell");
          var authHash = /access_token=|refresh_token=|error_description=|type=recovery/.test(location.hash);
          if (q === "portal") { try { sessionStorage.removeItem("mgb_shell_v1"); sessionStorage.removeItem("mgb_slate_path_v1"); } catch (e) {} }
          var onTasksPath = /^\/tasks\/?$/.test(p);
          var onSlatePath = /^\/slate\/?$/.test(p);
          var want = onTasksPath || q === "tasks" || onSlatePath;
          if (want) { try { sessionStorage.setItem("mgb_shell_v1", "tasks"); } catch (e) {} }
          if (onSlatePath) { try { sessionStorage.setItem("mgb_slate_path_v1", "1"); } catch (e) {} }
          else if (onTasksPath || q === "tasks") { try { sessionStorage.removeItem("mgb_slate_path_v1"); } catch (e) {} }
          // A pop-out opened with window.open copies the opener's sessionStorage;
          // drop the opener's pending arrival and route so they don't replay here.
          if ((q === "tasks" || onSlatePath) && window.opener) {
            try { sessionStorage.removeItem("mgb_lk_arrival_v1"); sessionStorage.removeItem("mygoodbooks_pending_route_v1"); } catch (e) {}
          }
          var shellNow = null; try { shellNow = sessionStorage.getItem("mgb_shell_v1"); } catch (e) {}
          if (shellNow === "tasks") window.MGB_SHELL = shellNow;
          // Google sign-in returns to /staff. Back to /slate when this tab started
          // there, only when the URL carries the auth hash or code, so a later
          // typed /staff in this tab is not trapped.
          var slateTab = null; try { slateTab = sessionStorage.getItem("mgb_slate_path_v1"); } catch (e) {}
          if (shellNow === "tasks" && slateTab === "1" && /^\/staff\/?$/.test(p) && (authHash || sp.has("code"))) {
            history.replaceState(history.state, "", "/slate" + location.search + location.hash);
            p = "/slate";
          }
          if (want || q) {
            sp.delete("shell");
            var s = sp.toString(), h = location.hash;
            if (!authHash && want && !/^#\/tasks(\/|$)/.test(h)) h = "#/tasks/my";
            // Only /tasks itself moves to "/"; any other path (/slate too) keeps its pathname.
            history.replaceState(history.state, "", (onTasksPath ? "/" : p) + (s ? "?" + s : "") + h);
          }
        } catch (e) {}
      })();

      // Installable app (manifest.webmanifest + app-icons/). STAFF ONLY, DESKTOP ONLY.
      // The browser only offers "Install" / "Add to Home Screen" once the
      // manifest is linked, so the links are added only when one of these is
      // true: INSTALL_APP_PUBLIC (everyone; clients stay off for now because
      // their sign-in emails open in the browser, not the app), a signed-in
      // staff member (AuthGate calls window.mgbInstallApp.set(true) once the
      // staff row checks out, and set(false) on sign-out, so a client never
      // gets the links), an already-installed copy, or a tester override
      // (/?install-app=1 on, /?install-app=0 off, or the "Show unreleased
      // features" flag in Developer tools). Phones and tablets (iPhone, iPad,
      // Android) never get the links at all: they just use the website.
      // MGB Slate (spec-desk-fullpage 2, 3.2): on /slate, and only once the app
      // has told us the Slate app is on (mgbInstallApp.setSlate(true), from
      // TK_SlateBridge.jsx), the links point at /slate.webmanifest (its own
      // installed app, id and scope /slate) and this script holds the browser's
      // install prompt for the "Install Slate app" button. On /slate the links
      // wait until the app says on or off; off links /manifest.webmanifest as
      // everywhere else. Every other path is exactly as before.
      (function () {
        var INSTALL_APP_PUBLIC = false;
        var STAFF_KEY = "mgb_install_staff_v1";
        function ls(fn) {
          try {
            return fn(localStorage);
          } catch (e) {
            return null;
          }
        }
        try {
          var params = new URLSearchParams(location.search);
          var flag = params.get("install-app");
          if (flag === "1") ls(function (l) { l.setItem("mgb_install_app_v1", "1"); });
          if (flag === "0") ls(function (l) { l.removeItem("mgb_install_app_v1"); });
          if (flag !== null) {
            params.delete("install-app");
            var qs = params.toString();
            history.replaceState(history.state, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
          }
        } catch (e) {}
        var staffOn = false; // in-memory fallback if localStorage throws
        // iPhone, iPad (incl. iPadOS posing as a Mac) and Android devices.
        function isMobile() {
          try {
            var ua = navigator.userAgent || "";
            if (/iPhone|iPad|iPod|Android|Mobile|Tablet/i.test(ua)) return true;
            if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return true;
            // Android Chrome "Request desktop site" (and big tablets) send a
            // Linux desktop UA; a touch screen on Linux is not a desktop.
            if (/Linux/.test(ua) && !/CrOS/.test(ua) && navigator.maxTouchPoints > 0) return true;
          } catch (e) {}
          return false;
        }
        function isStandalone() {
          try {
            return !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
          } catch (e) {
            return false;
          }
        }
        function wanted() {
          if (isMobile()) return false;
          var standalone = isStandalone();
          return (
            INSTALL_APP_PUBLIC ||
            standalone ||
            staffOn ||
            ls(function (l) { return l.getItem(STAFF_KEY); }) === "1" ||
            ls(function (l) { return l.getItem("mgb_install_app_v1"); }) === "1" ||
            ls(function (l) { return l.getItem("mygoodbooks_ff_unreleased_v1"); }) === "1"
          );
        }
        var added = [];
        var slatePath = /^\/slate\/?$/.test(location.pathname);
        var slateKnown = false; // /slate only: the app has said on or off
        var slateOn = false; // /slate only: the Slate app is on for this person
        var SLATE_INSTALLED_KEY = "mgb_slate_installed_v1";
        function add(tag, attrs) {
          var el = document.createElement(tag);
          for (var k in attrs) el.setAttribute(k, attrs[k]);
          document.head.appendChild(el);
          added.push(el);
        }
        // Chromium fires this only when Install is really on offer (page
        // installable, app not already installed).
        var installable = false;
        var slatePrompt = null; // /slate with the app on only: the stashed install prompt
        function slateLive() {
          return slatePath && slateKnown && slateOn;
        }
        window.addEventListener("beforeinstallprompt", function (e) {
          installable = true;
          // Only /slate with the Slate app on takes over the prompt. Everywhere
          // else the browser keeps its own behavior (no preventDefault).
          if (slateLive()) {
            try { e.preventDefault(); } catch (er) {}
            slatePrompt = e;
            try { window.dispatchEvent(new CustomEvent("mgb-slate-prompt")); } catch (er) {}
            // The browser offers install again (the app was removed), so an
            // "installed" mark is stale.
            ls(function (l) { l.removeItem(SLATE_INSTALLED_KEY); });
          }
        });
        if (slatePath) {
          window.addEventListener("appinstalled", function () {
            if (!slateLive()) return;
            slatePrompt = null;
            ls(function (l) { l.setItem(SLATE_INSTALLED_KEY, "1"); });
            try { window.dispatchEvent(new CustomEvent("mgb-slate-installed")); } catch (e) {}
          });
        }
        var addedSlate = false; // which manifest the current links point at
        function drop() {
          added.forEach(function (el) {
            if (el.parentNode) el.parentNode.removeChild(el);
          });
          added = [];
        }
        function apply() {
          // On /slate nothing is linked until the app says on or off.
          var on = wanted() && (!slatePath || slateKnown);
          var slate = slateLive();
          if (on && added.length && addedSlate !== slate) drop();
          if (on && !added.length) {
            addedSlate = slate;
            add("link", { rel: "manifest", href: slate ? "/slate.webmanifest" : "/manifest.webmanifest" });
            add("link", { rel: "apple-touch-icon", href: slate ? "/app-icons/slate-apple-touch-icon.png" : "/app-icons/apple-touch-icon.png" });
            add("meta", { name: "theme-color", content: slate ? "#06262D" : "#05080d" });
            add("meta", { name: "apple-mobile-web-app-title", content: slate ? "MGB Slate" : "MyGoodBooks" });
            add("meta", { name: "mobile-web-app-capable", content: "yes" });
          } else if (!on) {
            drop();
          }
        }
        window.mgbInstallApp = {
          // true once a staff member is signed in; false when signed out.
          set: function (staff) {
            staffOn = !!staff;
            ls(function (l) {
              if (staff) l.setItem(STAFF_KEY, "1");
              else l.removeItem(STAFF_KEY);
            });
            apply();
          },
          isPublic: INSTALL_APP_PUBLIC,
          // True only when the browser has actually offered Install in this
          // tab (used by the "install the app" tip). False on phones, inside
          // the app, and once it's installed.
          canOffer: function () {
            return !isMobile() && !isStandalone() && installable && wanted();
          },
          // MGB Slate: the app calls this once it knows whether the Slate app
          // is on for this person (TK_slateAppIsOn through TK_slateFlag). It
          // only changes anything on /slate.
          setSlate: function (on) {
            if (!slatePath) return;
            var was = slateKnown && slateOn;
            slateKnown = true;
            slateOn = !!on;
            if (was && !slateOn) slatePrompt = null;
            apply();
          },
          // MGB Slate: does this browser support installing at all (Chrome and
          // Edge on a computer)? Not the same as "offered right now".
          slateSupported: function () {
            return !isMobile() && "onbeforeinstallprompt" in window;
          },
          slateStandalone: function () {
            return isStandalone();
          },
          // /slate with the Slate app on only: show the browser install dialog
          // from the stashed prompt. Resolves "accepted", "dismissed" or "unavailable".
          prompt: function () {
            if (!slateLive() || !slatePrompt) return Promise.resolve("unavailable");
            var p = slatePrompt;
            slatePrompt = null;
            try {
              p.prompt();
              return p.userChoice.then(
                function (c) { return (c && c.outcome) || "dismissed"; },
                function () { return "dismissed"; }
              );
            } catch (e) {
              return Promise.resolve("unavailable");
            }
          },
          slateCanPrompt: function () {
            return slateLive() && !!slatePrompt;
          },
          slateInstalled: function () {
            return ls(function (l) { return l.getItem(SLATE_INSTALLED_KEY); }) === "1";
          },
        };
        apply();
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Lato font. The firm switch tk_settings.lato_enabled decides (cached in
      // mgb_lato_cache after the first read; code never writes the switch). The
      // per-person checkboxes mgb_lato_preview (retired 2026-10-25) and
      // mgb_lato_classic (retired 2026-10-28) are gone: the switch has been on
      // for everyone since 2026-10-21.
      (function () {
        var ls = function (k) {
          try {
            return window.localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        };
        var lsSet = function (k, v) {
          try {
            if (v == null) window.localStorage.removeItem(k);
            else window.localStorage.setItem(k, v);
          } catch (e) {}
        };
        var applied = false;
        function apply(on) {
          if (!on) {
            document.documentElement.removeAttribute("data-font");
            return;
          }
          document.documentElement.setAttribute("data-font", "lato");
          if (applied) return;
          applied = true;
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = "https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap";
          document.head.appendChild(l);
        }
        apply(ls("mgb_lato_cache") === "1");
        var tries = 0;
        var t = setInterval(function () {
          var c = window.mgbSupabase;
          if (!c) {
            if (++tries > 60) clearInterval(t);
            return;
          }
          clearInterval(t);
          try {
            c.from("tk_settings")
              .select("value")
              .eq("key", "lato_enabled")
              .maybeSingle()
              .then(function (res) {
                var v = res && !res.error && res.data ? res.data.value : undefined;
                var on = v === true || v === "true" || v === 1 || (!!v && typeof v === "object" && v.on === true);
                lsSet("mgb_lato_cache", on ? "1" : null);
                apply(on);
              }, function () {});
          } catch (e) {}
        }, 500);
      })();
    </script>
    <script>
      // Brand colors and Hover menus. Same pattern as Lato above. Brand colors:
      // the firm switch tk_settings.brand_enabled decides (cached in
      // mgb_brand_cache after the first read), else the old look. The per-person
      // checkboxes mgb_brand_preview (retired 2026-10-25) and mgb_brand_classic
      // (retired 2026-10-28) are gone: the switch is on for everyone.
      // When on it sets data-brand="mgb" on <html> (styles.css swaps in the brand
      // guide's navy/teal and Montserrat headings) and loads Montserrat only then.
      // Hover menus: this script only caches the firm switch
      // tk_settings.hovernav_enabled in mgb_hovernav_cache and announces a change
      // (window event "mgb:hovernav"); the one place that decides is HN_on() in
      // components/staff/HoverNav.jsx. Code never writes either switch.
      // The same single read also caches the Slate app firm switch
      // (tk_settings.slate_app_enabled) in mgb_slate_cache. Only the Slate app
      // launch notice, tour and What's new entry read that cache
      // (ANN_slateLaunchOn in components/tour/announcements.js); the Slate app
      // itself is decided by TK_slateAppIsOn, never by this cache. It also caches
      // the month rhythm firm switch (tk_settings.month_rhythm_enabled) in
      // mgb_rhythm_cache, read by TK_rhythmEnabled (components/tasks/TK_rhythmLogic.js)
      // until its own read, and by the month rhythm launch notice (ANN_rhythmLaunchOn).
      (function () {
        var ls = function (k) {
          try {
            return window.localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        };
        var lsSet = function (k, v) {
          try {
            if (v == null) window.localStorage.removeItem(k);
            else window.localStorage.setItem(k, v);
          } catch (e) {}
        };
        var applied = false;
        function applyBrand(on) {
          if (!on) {
            document.documentElement.removeAttribute("data-brand");
            return;
          }
          document.documentElement.setAttribute("data-brand", "mgb");
          if (applied) return;
          applied = true;
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = "https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap";
          document.head.appendChild(l);
        }
        applyBrand(ls("mgb_brand_cache") === "1");
        var isOn = function (v) {
          return v === true || v === "true" || v === 1 || (!!v && typeof v === "object" && v.on === true);
        };
        var tries = 0;
        var t = setInterval(function () {
          var c = window.mgbSupabase;
          if (!c) {
            if (++tries > 60) clearInterval(t);
            return;
          }
          clearInterval(t);
          try {
            c.from("tk_settings")
              .select("key,value")
              .in("key", ["brand_enabled", "hovernav_enabled", "slate_app_enabled", "month_rhythm_enabled"])
              .then(function (res) {
                if (!res || res.error) return;
                var vals = {};
                (res.data || []).forEach(function (r) {
                  vals[r.key] = r.value;
                });
                var brandOn = isOn(vals.brand_enabled);
                lsSet("mgb_brand_cache", brandOn ? "1" : null);
                applyBrand(brandOn);
                lsSet("mgb_slate_cache", isOn(vals.slate_app_enabled) ? "1" : null);
                lsSet("mgb_rhythm_cache", isOn(vals.month_rhythm_enabled) ? "1" : null);
                var hoverBefore = ls("mgb_hovernav_cache");
                lsSet("mgb_hovernav_cache", isOn(vals.hovernav_enabled) ? "1" : null);
                if (ls("mgb_hovernav_cache") !== hoverBefore) {
                  try {
                    window.dispatchEvent(new Event("mgb:hovernav"));
                  } catch (e) {}
                }
              }, function () {});
          } catch (e) {}
        }, 500);
      })();
    </script>
    <!-- One request for the whole app. Bitter / IBM Plex Sans / IBM Plex Mono are
         shared with <DailyClose />; the shell additionally needs Bitter italic and
         weight 800. No next/font here (no Next.js, no bundler), so they load the
         <link> way, per the component's integration notes. Lato 900 is loaded only for the MyGoodBooks wordmark (.brand-name). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Lato:wght@900&display=swap"
      rel="stylesheet"
    />
    <script>
      // §149/§161: no explicit theme choice follows the OS light/dark
      // setting (app.jsx's autoTheme), not always-dark. This mirrors
      // app.jsx's systemOrClockTheme() exactly — matchMedia is readable
      // synchronously, so unlike the geolocation lookup this replaced,
      // the very first frame can now agree with what React will render
      // instead of being refined afterward. The clock heuristic remains
      // the fallback for a browser reporting no preference.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("mygoodbooks_theme_v1");
        } catch (e) {}
        var theme;
        if (stored === "light" || stored === "dark") {
          theme = stored;
        } else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          theme = "dark";
        } else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches
        ) {
          theme = "light";
        } else {
          var hour = new Date().getHours();
          theme = hour >= 6 && hour < 19 ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();

      // Bumped by hand alongside each deploy-worthy change — there's no build
      // step to inject a real commit SHA into (see the no-bundler note up
      // top). Shown in Developer Tools' System info card so staff can confirm
      // which version they're looking at without guessing from Vercel's UI.
      window.MGB_VERSION = { label: "2026-10-30a", note: "The word Workbench is gone from everything people read: the staff guide, What's new, tours, tips, README and Developer tools now say Desk (code names, routes and database objects are unchanged); the staff guide text was updated in the database too. Earlier, 2026-10-28z: Slate plus launched, nothing changes until the owner sets slateplus_enabled: the staff guide articles (What's in Slate plus?, profiles and one search, Blocked by, custom fields, admin Slate rules, and the Slate, task, top bar, Team, tips and What's new articles), one slate-plus next-visit notice with the Slate plus tour, and the Slate plus tips are published; the notice waits for the switch (preview users see the tour and tips early); no database change. Earlier, 2026-10-28v: Developer tools cleanup part 2, nothing visible to clients: the eight finished Supabase SQL rows in Developer tools (Tasks bulk actions + undo, close checklist, late-task grace period, Desk, manage projects, project colors, unassigned + Asana import, client org profile + gifts) became one pointer row, the five Slate month rhythm SQL rows became one, and the System info Audit log read row was removed (the Recent activity card keeps its own error); Asana undo recipe moved to docs/asana-daily-import.md; no database change. Earlier, 2026-10-28t: Client agreements (staff live): each client's Documents tab has an Agreements card (service agreements, engagement letters, changes, with signed and renewal dates and an Expires in N days pill within 60 days). Admins and the client's account manager add (one, or Paste several links), edit, mark signed, show or hide and trash; bookkeepers read; admins restore. New agreements start Staff only. Clients see nothing until the owner sets agreements_client_enabled (unset). New table client_agreements (migration client_agreements). Earlier, 2026-10-28s: Hidden, nothing visible: Slate plus custom fields (preview only, same Slate plus preview):          IS the thing holding the session.

         Regenerating a hash after a version bump (the CDN serves the npm
         tarball's file verbatim, so the tarball is the source of truth):
           npm pack react@18.3.1 && tar xzf react-18.3.1.tgz
           openssl dgst -sha384 -binary package/umd/react.production.min.js \
             | openssl base64 -A
         A mismatched hash makes the browser refuse the script outright, so if
         the app ever boots to a blank page right after a version change, these
         attributes are the first thing to check. -->

    <script
      defer
      crossorigin="anonymous"
      integrity="sha384-Xl/CUCfJbzsngMp0CFxkmF0VW/8C160IsGujqeQlIhaGxKz2+JsIGORFqtCPeldF"
      src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"
    ></script>

    <script>
      // Manually fetch + transform each file so we can force Babel's
      // "classic" JSX runtime (the default "automatic" runtime needs a
      // real module bundler, which we intentionally don't have here).
      async function loadBabelScript(path) {
        // Text was already requested in <head>; this just awaits that promise.
        const src = await window.__sources[path];
        // DailyClose ships as TypeScript. The preset only strips the types
        // (no type-checking) and infers JSX from the filename we pass below,
        // so a plain .ts file never gets the JSX plugin it would reject.
        const presets = [];
        if (/\.tsx?$/.test(path)) presets.push("typescript");
        if (/\.(jsx|tsx)$/.test(path)) presets.push(["react", { runtime: "classic" }]);
        if (/\.js$/.test(path)) presets.push(["react", { runtime: "classic" }]);
        const code = Babel.transform(src, { filename: path, presets }).code;
        const script = document.createElement("script");
        script.text = code;
        document.body.appendChild(script);
      }

      // §133: fetches the real client-org roster from Supabase's `clients`
      // table and merges it onto data.js's window.CLIENTS (already assigned
      // an empty array by data.js, then re-populated here). Every
      // CLIENTS_MOCK_DATA entry (mock financial/content data, still in
      // data.js) is matched onto its roster row by `id`; a roster row with
      // no matching mock entry still merges in on its own (a newly
      // admin-added client has no mock data yet, and that's fine — nothing
      // should crash or skip it). Must run after data.js (which declares
      // window.CLIENTS) and before app.jsx (which reads it as a plain
      // synchronous array via the bare `CLIENTS` identifier throughout, with
      // no await anywhere in app.jsx). If Supabase isn't configured, or the
      // fetch fails, window.CLIENTS is left as the empty array rather than
      // letting a network hiccup block the whole app from booting.
      async function loadClientsRoster() {
        const supabase = window.mgbSupabase;
        if (!supabase) return;
        try {
          const baseCols =
            "id, name, org_type, entity_type, plan, test_only, payroll_add_on, assigned_bookkeeper, assigned_bookkeeper_email";
          // account_manager / account_manager_email
          // (supabase/account-manager.sql). Until that migration is applied
          // the select fails, so retry without them; window.AM_COLS_OK tells
          // the Client Roster whether to read and write the columns.
          // clients.is_internal (supabase/internal-company-profile.sql) marks
          // MyGoodBooks' own profile ("MGB (internal)"), which is not a
          // client. Asked for first; if that migration isn't applied yet the
          // select fails and we retry without it, so nothing else changes.
          let { data, error } = await supabase
            .from("clients")
            .select(baseCols + ", account_manager, account_manager_email, is_internal");
          if (error) {
            ({ data, error } = await supabase
              .from("clients")
              .select(baseCols + ", account_manager, account_manager_email"));
          }
          window.AM_COLS_OK = !error;
          if (error) {
            ({ data, error } = await supabase.from("clients").select(baseCols));
          }
          if (error) {
            console.warn("Couldn't load client roster from Supabase:", error.message);
            window.ROSTER_LOAD_ERROR = true;
            return;
          }
          const mockById = {};
          (window.CLIENTS_MOCK_DATA_SOURCE || []).forEach((c) => {
            mockById[c.id] = c;
          });
          window.CLIENTS = (data || []).map((row) => {
            const roster = {
              id: row.id,
              name: row.name,
              orgType: row.org_type,
              // clients.entity_type (supabase/client-entity-type.sql).
              entityType: row.entity_type || "nonprofit",
              plan: row.plan,
              testOnly: row.test_only,
              // MGB's own profile: shown only in the MGB (internal) place,
              // never in a client list or count (app.jsx rosterClients).
              isInternal: row.is_internal === true,
              payrollAddOn: row.payroll_add_on,
              // assigned_bookkeeper_email (supabase/assigned-bookkeeper-email.sql)
              // is the real staff link; folded into the display object so
              // consumers can match on email and fall back to the name.
              assignedBookkeeper: row.assigned_bookkeeper
                ? Object.assign({}, row.assigned_bookkeeper, {
                    email: row.assigned_bookkeeper_email || null,
                  })
                : null,
              accountManager: row.account_manager_email
                ? {
                    name: row.account_manager || row.account_manager_email.split("@")[0],
                    email: row.account_manager_email,
                  }
                : null,
            };
            // withClientDataDefaults (data.js) backfills the empty arrays a
            // roster-only org has none of, so app.jsx's unguarded
            // client.monthly[...] / client.bankAccounts[0] indexing renders an
            // empty state instead of throwing into the root ErrorBoundary.
            // Only test clients (clients.test_only = true) get data.js's
            // sample numbers. A real client starts empty, even when its id
            // matches a sample entry, and gets QuickBooks data (and real
            // logins, messages, documents) only.
            const sample = row.test_only === false ? null : mockById[row.id];
            return window.withClientDataDefaults(
              Object.assign({}, sample, roster),
            );
          });
        } catch (err) {
          console.warn("Couldn't load client roster from Supabase:", err);
        }
      }

      // §170: the QuickBooks half of the same boot step. loadClientsRoster
      // above gives each client its identity; this gives the connected ones
      // their actual numbers, replacing data.js's sample arrays via
      // window.mapQboToClient (components/qbo/mapQboToClient.js).
      //
      // Additive and fail-soft, exactly like the roster loader: a client
      // with no qbo_connections row, a disconnected one, a query that errors,
      // or no Supabase at all simply keeps its sample data and its
      // "Sample Data" banners. Nothing here can stop the app booting.
      //
      // Runs AFTER loadClientsRoster (it reads window.CLIENTS) and before
      // app.jsx, which takes window.CLIENTS as a plain synchronous array.
      // RLS does the scoping — the qbo_* policies only return rows for
      // clients this session may see — so the .in() filters below are about
      // not fetching rows we'd throw away, not about access control.
      //
      // Also re-run after boot by the header's "Sync now" button
      // (window.mgbReloadQboData in app.jsx) with `onlyIds` = the one client
      // just synced: same queries, same mapper, narrowed to that client, and
      // every other client passes through untouched. mapQboToClient is
      // idempotent over an already-mapped client (it Object.assigns the same
      // six fields again), so re-mapping is safe.
      async function loadQboData(onlyIds) {
        const supabase = window.mgbSupabase;
        if (!supabase) return;
        if (!window.mapQboToClient) return;
        const clients = window.CLIENTS || [];
        if (!clients.length) return;
        const ids = Array.isArray(onlyIds) && onlyIds.length
          ? clients.map((c) => c.id).filter((id) => onlyIds.indexOf(id) !== -1)
          : clients.map((c) => c.id);
        if (!ids.length) return;
        try {
          const { data: connections, error: connErr } = await supabase
            .from("qbo_connections")
            .select("client_id, status, last_synced_at, last_error")
            .in("client_id", ids);
          if (connErr) {
            console.warn("Couldn't load QuickBooks connections:", connErr.message);
            return;
          }
          const connById = {};
          (connections || []).forEach((row) => {
            connById[row.client_id] = row;
          });
          // 'error' too: a connection that broke after syncing keeps its
          // cached numbers on screen (staff see the red "needs reconnecting"
          // banner over them) rather than dropping back to no data.
          const liveIds = (connections || [])
            .filter((row) => row.status === "connected" || row.status === "error")
            .map((row) => row.client_id);
          if (!liveIds.length) return;

          // One round trip per table for every connected client at once,
          // rather than per client per table.
          const tables = {
            accounts: "qbo_accounts",
            monthlyPl: "qbo_monthly_pl",
            budgetLines: "qbo_budget_lines",
            plLines: "qbo_pl_lines",
            invoices: "qbo_invoices",
            bills: "qbo_bills",
            transactions: "qbo_transactions",
            // Which income accounts count as giving (staff pick; no row =
            // automatic). supabase/client-giving-accounts.sql. Fail-soft:
            // an error here just means automatic detection.
            givingSettings: "client_giving_accounts",
            // Which balance-sheet accounts are funds, restricted or not
            // (staff pick; no row = automatic).
            // supabase/client-fund-accounts.sql. Fail-soft like the above.
            fundSettings: "client_fund_accounts",
          };
          // PostgREST returns at most 1,000 rows per request, so a busy
          // client's transactions (or several clients' P&L lines) were
          // silently cut off. Page through each table in primary-key order
          // until a short page comes back.
          const pkOrder = {
            qbo_accounts: ["client_id", "qbo_id"],
            qbo_monthly_pl: ["client_id", "month"],
            qbo_budget_lines: ["client_id", "month", "account_name"],
            qbo_pl_lines: ["client_id", "month", "account_type", "account_name"],
            qbo_invoices: ["client_id", "qbo_id"],
            qbo_bills: ["client_id", "qbo_id"],
            qbo_transactions: ["client_id", "txn_type", "qbo_id"],
            client_giving_accounts: ["client_id"],
            client_fund_accounts: ["client_id"],
          };
          const QBO_PAGE = 1000;
          const QBO_MAX_PAGES = 50;
          async function fetchAllRows(table) {
            let all = [];
            for (let page = 0; page < QBO_MAX_PAGES; page++) {
              let q = supabase.from(table).select("*").in("client_id", liveIds);
              (pkOrder[table] || ["client_id"]).forEach((col) => {
                q = q.order(col, { ascending: true });
              });
              const from = page * QBO_PAGE;
              const { data, error } = await q.range(from, from + QBO_PAGE - 1);
              if (error) return { data: all, error };
              all = all.concat(data || []);
              if (!data || data.length < QBO_PAGE) break;
            }
            return { data: all, error: null };
          }
          const keys = Object.keys(tables);
          const results = await Promise.all(
            keys.map((key) => fetchAllRows(tables[key])),
          );
          const byKey = {};
          keys.forEach((key, i) => {
            const { data, error } = results[i];
            if (error) {
              console.warn(
                "Couldn't load " + tables[key] + ":",
                error.message,
              );
            }
            byKey[key] = data || [];
          });

          // Bucket every table's rows by client once, so mapping is a lookup
          // rather than a filter per client per table.
          const rowsByClient = {};
          liveIds.forEach((id) => {
            rowsByClient[id] = { connection: connById[id] };
            keys.forEach((key) => {
              rowsByClient[id][key] = [];
            });
          });
          keys.forEach((key) => {
            byKey[key].forEach((row) => {
              const bucket = rowsByClient[row.client_id];
              if (bucket) bucket[key].push(row);
            });
          });

          window.CLIENTS = clients.map((client) => {
            const rows = rowsByClient[client.id];
            // A connected client whose first sync hasn't landed yet has a
            // connection row but no data. Mapping it would blank every page
            // and still claim "Live", which is worse than sample data —
            // so require at least some real numbers first.
            if (!rows) return client;
            const hasData =
              rows.accounts.length ||
              rows.monthlyPl.length ||
              rows.invoices.length ||
              rows.bills.length;
            if (!hasData) return client;
            return window.mapQboToClient(client, rows);
          });
        } catch (err) {
          console.warn("Couldn't load QuickBooks data from Supabase:", err);
        }
      }

      window.mgbReloadQboData = loadQboData;
      // The roster and the QuickBooks numbers are read once at boot. A client
      // who signs in on this page without a reload (typing the 6-digit code)
      // had no session at boot, so both came back empty; ClientAuthGate calls
      // this once the sign-in is confirmed so the portal has the client's org.
      window.mgbReloadRoster = async function () {
        window.ROSTER_LOAD_ERROR = false;
        await loadClientsRoster();
        await loadQboData();
      };

      (async () => {
        try {
          // Order still matters — data.js and DailyClose must exist before
          // app.jsx runs — but every file is already in flight by now.
          for (const path of window.__SOURCE_ORDER) {
            await loadBabelScript(path);
            if (path === "data.js") await loadClientsRoster();
            // Needs both the roster (window.CLIENTS) and the mapper, and must
            // land before app.jsx reads window.CLIENTS synchronously.
            if (path === "components/qbo/mapQboToClient.js") await loadQboData();
          }
        } catch (err) {
          const root = document.getElementById("root");
          if (root) {
            root.innerHTML =
              '<div class="boot-splash"><div class="boot-splash-mark">MyGoodBooks</div>' +
              '<div class="boot-splash-sub">Something went wrong loading the portal. ' +
              "Please refresh.</div></div>";
          }
          throw err;
        }
      })();
    </script>
  </body>
</html>
